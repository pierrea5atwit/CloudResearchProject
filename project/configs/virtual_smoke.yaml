environment: "virtual"
experiment:
  duration_seconds: 5
  warmup_seconds: 1
  repeat_runs: 1
workload:
  n_samples: 2000
  n_features: 16
  n_classes: 3
  batch_size: 64
  k_neighbors: 3
  inference_loops: 20
  random_seed: 42
  backend: "numpy"
concurrency:
  num_workers: 2
monitoring:
  sample_interval_sec: 1
logging:
  output_dir: "results/"
  log_interval: 1
