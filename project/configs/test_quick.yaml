environment: "virtual"

experiment:
  duration_seconds: 5
  warmup_seconds: 1
  repeat_runs: 1

workload:
  n_samples: 1000
  n_features: 16
  batch_size: 100
  k_neighbors: 3
  inference_loops: 20

concurrency:
  num_workers: 1

monitoring:
  sample_interval_sec: 1

logging:
  output_dir: "results/"
  log_interval: 1
