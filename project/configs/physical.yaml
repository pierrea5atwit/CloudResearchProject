environment: "physical"

experiment:
  duration_seconds: 60
  warmup_seconds: 5
  repeat_runs: 3

workload:
  n_samples: 1000000
  n_features: 64
  batch_size: 2000
  k_neighbors: 5
  inference_loops: 1000

concurrency:
  num_workers: 8

monitoring:
  sample_interval_sec: 1

logging:
  output_dir: "results/"
  log_interval: 1